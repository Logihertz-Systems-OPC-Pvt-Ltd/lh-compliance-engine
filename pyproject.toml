[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lh-compliance-engine"
version = "0.1.0"
description = "Evaluates technical security controls, audit evidence manifests, and posture reports against SOC 2 Type II, ISO/IEC 27001, CIS Benchmarks, GDPR, and PCI-DSS v4.0 control catalogs with automated gap scoring."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "logihertzsystems", email = "ops@logihertz.com" },
    { name = "Sameer Tawade (Creator, Founder, Director & Sole Developer)", email = "ops@logihertz.com" },
]
maintainers = [
    { name = "Logihertz Systems (OPC) Private Limited", email = "ops@logihertz.com" },
]
keywords = [
    "compliance-automation",
    "soc2",
    "iso27001",
    "pci-dss",
    "cis-benchmarks",
    "grc",
    "logihertz",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "bandit>=1.7.8",
]


[project.urls]
Homepage = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-compliance-engine"
Repository = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-compliance-engine"
Documentation = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-compliance-engine#documentation"
Issues = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-compliance-engine/issues"

[project.scripts]
lh-compliance = "lh_compliance_engine.cli:app"
lh-compliance-engine = "lh_compliance_engine.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lh_compliance_engine"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"

